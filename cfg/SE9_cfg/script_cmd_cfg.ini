pass_flag = QA_PASS_INTERFACE_FLAG
fail_flag = QA_FAIL_INTERFACE_FLAG
case_timeout = 120

[chip_type_check]
exec_cmd = sudo busybox devmem 0x27102014
pass_flag = 0x000001FF
fail_flag = FAIL
case_timeout = 30
sudo = 1
sudo_password = linaro

[firmware_version_check]
exec_cmd = sudo bm_version
pass_flag = SophonSDK
fail_flag = FAIL
case_timeout = 30
sudo = 1
sudo_password = linaro

[check_inter_flag]
exec_cmd = cat /factory/OEMconfig.ini
pass_flag = INTERFACE_FLAG = 0x01
fail_flag = FAIL
case_timeout = 30

[upload_aging_files]
exec_cmd = ls /data/soc_aging/
pass_flag = aging_parallel.sh
fail_flag = No such file
case_timeout = 30

[run_aging_test]
exec_cmd = sh -c 'cd /data/soc_aging && nohup ./aging.sh --chip_type bm1688 --loop 1 --reboot 0 > /dev/null 2>&1 & echo AGING_STARTED'
pass_flag = AGING_STARTED
fail_flag = FAIL
case_timeout = 30
sudo = 0
sudo_password = linaro

[set_aging_flag]
exec_cmd = sh -c "cd /data/soc_aging/ && ./set_aging_flag.sh"
pass_flag = AGING_PASS_FLAG
fail_flag = AGING_FAIL_FLAG
case_timeout = 30
sudo = 1
sudo_password = linaro

[remove_aging_files]
exec_cmd = rm -rf /data/soc_aging/ && echo PASS
pass_flag = PASS
fail_flag = FAIL
case_timeout = 30
sudo = 1
sudo_password = linaro
