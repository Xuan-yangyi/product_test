[USB]
exec_cmd = "./test_usb.sh 2"
pass_flag = QA_PASS_USB
fail_flag = QA_FAIL_USB
case_timeout = 180

[NVME_DRIVE]
exec_cmd = "./test_nvme_drive.sh 1"
pass_flag = QA_PASS_NVME_DRIVE
fail_flag = QA_FAIL_NVME_DRIVE
case_timeout = 120

[SATA_DRIVE]
exec_cmd = "./test_sata_drive.sh 2"
pass_flag = QA_PASS_SATA_DRIVE
fail_flag = QA_FAIL_SATA_DRIVE
case_timeout = 120

[SDCARD]
exec_cmd = "./test_sdcard.sh /dev/mmcblk2"
pass_flag = QA_PASS_SDCARD
fail_flag = QA_FAIL_SDCARD
case_timeout = 120

[UART]
exec_cmd = "./test_uart.sh"
pass_flag = QA_PASS_UART
fail_flag = QA_FAIL_UART
case_timeout = 120

