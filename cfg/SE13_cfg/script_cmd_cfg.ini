[chip_type_check]
exec_cmd = busybox devmem 0x27102014
pass_flag = 0x00000
fail_flag = FAIL
case_timeout = 30
sudo = 1
sudo_password = linaro

[firmware_version_check]
exec_cmd = bm_version
pass_flag = SophonSDK
fail_flag = FAIL
case_timeout = 30
sudo = 1
sudo_password = linaro

[ETH]
exec_cmd = "./test_network.sh"
pass_flag = QA_PASS_NETWORK
fail_flag = FAIL
case_timeout = 120

[USB]
exec_cmd = "./test_usb.sh"
pass_flag = QA_PASS_USB
fail_flag = QA_FAIL_USB
case_timeout = 180

[EMMC]
exec_cmd = "./check_emmc.sh"
pass_flag = QA_PASS_EMMC
fail_flag = QA_FAIL_EMMC
case_timeout = 120

[DRIVE]
exec_cmd = "./test_ssd.sh"
pass_flag = QA_PASS_SSD
fail_flag = QA_FAIL_SSD
case_timeout = 120

[INTERFACE_FLAG]
exec_cmd = "./set_interface_flag.sh"
pass_flag = QA_PASS_INTERFACE_FLAG
fail_flag = QA_FAIL_INTERFACE_FLAG
case_timeout = 120

[check_inter_flag]
exec_cmd = "cat /factory/OEMconfig.ini"
pass_flag = INTERFACE_FLAG
fail_flag = FAIL
case_timeout = 30

[upload_aging_files]
exec_cmd = "upload_aging_files"
pass_flag = AGING_UPLOAD_OK
fail_flag = AGING_UPLOAD_FAIL
case_timeout = 1800

[run_aging_test]
exec_cmd = "run_aging_test"
pass_flag = AGING_STARTED
fail_flag = FAIL
case_timeout = 30

[monitor_aging]
exec_cmd = "monitor_aging"
pass_flag = AGING_PASS_ALL
fail_flag = AGING_FAIL
case_timeout = 86400

[set_aging_flag]
exec_cmd = "cd /data/cv84x6_soc_aging/ && ./set_aging_flag.sh"
pass_flag = AGING_PASS_FLAG
fail_flag = AGING_FAIL_FLAG
case_timeout = 30

[remove_aging_files]
exec_cmd = "rm -rf /data/cv84x6_soc_aging/ && echo PASS"
pass_flag = PASS
fail_flag = FAIL
case_timeout = 30

[4G]
exec_cmd = "./test_4g_modem.sh"
pass_flag = QA_PASS_4G_MODEM
fail_flag = QA_FAIL_4G_MODEM
case_timeout = 60

[WIFI]
exec_cmd = "./test_wifi.sh"
pass_flag = QA_PASS_WIFI
fail_flag = QA_FAIL_WIFI
case_timeout = 180

[RS232]
exec_cmd = "./test_rs232.sh --mode tester"
pass_flag = QA_PASS_RS232
fail_flag = QA_FAIL_RS232
case_timeout = 180

[RS485]
exec_cmd = "./test_rs485.sh --mode tester"
pass_flag = QA_PASS_RS485
fail_flag = QA_FAIL_RS485
case_timeout = 180

[IO]
exec_cmd = "./test_io.sh"
pass_flag = QA_PASS_IO
fail_flag = FAIL
case_timeout = 60

[CAN]
exec_cmd = "./test_can.sh"
pass_flag = QA_PASS_CAN
fail_flag = QA_FAIL_CAN
case_timeout = 60

[SSD]
exec_cmd = "./test_ssd.sh"
pass_flag = QA_PASS_SSD
fail_flag = QA_FAIL_SSD
case_timeout = 60

[HDMI_RESOLUTION]
exec_cmd = "./test_hdmi_resolution.sh"
pass_flag = QA_PASS_HDMI_RESOLUTION
fail_flag = QA_FAIL_HDMI_RESOLUTION
case_timeout = 60

[USB_FLASH]
exec_cmd = "./test_usb_flash.sh"
pass_flag = QA_PASS_USB_FLASH
fail_flag = QA_FAIL_USB_FLASH
case_timeout = 120

[MEMORY_STORAGE]
exec_cmd = "./test_memory_storage.sh"
pass_flag = QA_PASS_MEMORY_STORAGE
fail_flag = FAIL
case_timeout = 120

[HW_STATUS]
exec_cmd = "./hw_status.sh"
pass_flag = QA_PASS_HW_STATUS
fail_flag = QA_FAIL_HW_STATUS
case_timeout = 30

[SE13_USB_4G]
exec_cmd = "./se13_usb_4g_combined.sh"
pass_flag = QA_PASS_SE13_USB_4G
fail_flag = QA_FAIL_SE13_USB_4G
case_timeout = 180

[OEM]
exec_cmd = "./burn_oem.sh"
pass_flag = QA_PASS_OEM
fail_flag = QA_FAIL_OEM
case_timeout = 120

[SN]
exec_cmd = "./burn_oem.sh"
pass_flag = QA_PASS_OEM
fail_flag = QA_FAIL_OEM
case_timeout = 120

[MAC]
exec_cmd = "./burn_oem.sh"
pass_flag = QA_PASS_OEM
fail_flag = QA_FAIL_OEM
case_timeout = 120

[AUDIO]
